# Alembic configuration for Pathology Report Explainer MVP.
# For local MVP we also call Base.metadata.create_all() on startup.
# Prefer `alembic upgrade head` when deploying to Postgres.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Overridden programmatically in env.py from Settings.database_url
sqlalchemy.url = sqlite:///./pathology_explainer.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
